name: Release patched upstream build

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/patched-release.yml'
      - 'README.md'
      - 'FORK_NOTICE.md'
      - 'PATCH_NOTES.md'
      - 'patches/**'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Optional upstream tag override (for example v2.7)
        required: false
        type: string
      force_release:
        description: Rebuild even if the patched release tag already exists
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 */12 * * *'

permissions:
  contents: write

concurrency:
  group: patched-upstream-release
  cancel-in-progress: false

jobs:
  build_release:
    name: Build patched upstream release
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          path: fork

      - name: Determine upstream tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          upstream_tag="${{ inputs.upstream_tag }}"
          if [[ -z "${upstream_tag}" ]]; then
            upstream_tag="$(
              git ls-remote --refs --tags https://github.com/chenxiaolong/BCR.git 'v*' \
                | awk '{print $2}' \
                | sed 's|refs/tags/||' \
                | sort -V \
                | tail -n 1
            )"
          fi

          if [[ -z "${upstream_tag}" ]]; then
            echo "::error::Failed to determine the latest upstream tag"
            exit 1
          fi

          echo "upstream_tag=${upstream_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=patched-${upstream_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_name=Patched ${upstream_tag}" >> "${GITHUB_OUTPUT}"

      - name: Check whether release already exists
        id: release_state
        shell: bash
        run: |
          set -euo pipefail

          if git -C fork ls-remote --exit-code origin \
              "refs/tags/${{ steps.version.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Stop when patched release already exists
        if: steps.release_state.outputs.exists == 'true' && github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && inputs.force_release)
        shell: bash
        run: |
          echo "Patched release ${{ steps.version.outputs.release_tag }} already exists"

      - name: Check out upstream source
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: chenxiaolong/BCR
          ref: ${{ steps.version.outputs.upstream_tag }}
          fetch-depth: 0
          path: source

      - name: Validate gradle wrapper checksum
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        uses: gradle/actions/wrapper-validation@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          min-wrapper-count: 1

      - name: Set up JDK 21
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate release signing secrets
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSPHRASE: ${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSPHRASE: ${{ secrets.RELEASE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          for var in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_KEYSTORE_PASSPHRASE \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSPHRASE; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Missing GitHub Actions secret ${var}"
              exit 1
            fi
          done

      - name: Apply local patches
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        shell: bash
        run: |
          set -euo pipefail

          git -C source config user.name "autokick"
          git -C source config user.email "151527951+autokick@users.noreply.github.com"
          git -C source am --3way "${GITHUB_WORKSPACE}"/fork/patches/*.patch

      - name: Add fork provenance to source tree
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        shell: bash
        run: |
          set -euo pipefail

          cp fork/README.md source/README.md
          cp fork/FORK_NOTICE.md source/FORK_NOTICE.md
          cp fork/PATCH_NOTES.md source/PATCH_NOTES.md

          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          replacements = {
              'props["author"] = "chenxiaolong"':
                  'props["author"] = "chenxiaolong; autokick (fork patches)"',
              'props["description"] = "Basic Call Recorder"':
                  'props["description"] = "Basic Call Recorder - patched fork"',
              '        from(File(rootDir, "README.md"))':
                  '        from(File(rootDir, "README.md"))\n'
                  '        from(File(rootDir, "FORK_NOTICE.md"))\n'
                  '        from(File(rootDir, "PATCH_NOTES.md"))',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected build.gradle.kts text not found: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git -C source add README.md FORK_NOTICE.md PATCH_NOTES.md app/build.gradle.kts
          GIT_AUTHOR_DATE="2000-01-01T00:00:00Z" \
          GIT_COMMITTER_DATE="2000-01-01T00:00:00Z" \
            git -C source commit -m "Add fork release provenance"

      - name: Prepare corresponding source archive
        id: source_archive
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        shell: bash
        run: |
          set -euo pipefail

          filename="BCR-${{ steps.version.outputs.release_tag }}-source.tar.gz"
          path="${GITHUB_WORKSPACE}/${filename}"
          git -C source archive \
            --format=tar \
            --prefix="BCR-${{ steps.version.outputs.release_tag }}-source/" \
            HEAD | gzip -n > "${path}"

          echo "filename=${filename}" >> "${GITHUB_OUTPUT}"
          echo "path=${path}" >> "${GITHUB_OUTPUT}"

      - name: Prepare signing inputs
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          sdk_dir="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${sdk_dir}" ]]; then
            echo "::error::ANDROID_SDK_ROOT or ANDROID_HOME must be available on the runner"
            exit 1
          fi

          printf 'sdk.dir=%s\n' "${sdk_dir}" > source/local.properties
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > source/release.keystore

      - name: Build patched release
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        shell: bash
        env:
          RELEASE_KEYSTORE: ${{ github.workspace }}/source/release.keystore
          RELEASE_KEYSTORE_PASSPHRASE: ${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSPHRASE: ${{ secrets.RELEASE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          cd source
          ./gradlew --no-daemon assembleRelease zipRelease

      - name: Prepare signing metadata
        id: signing
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        shell: bash
        run: |
          set -euo pipefail

          apk_path="$(find source/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [[ -z "${apk_path}" ]]; then
            echo "::error::No release APK was produced"
            exit 1
          fi

          sdk_dir="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "${sdk_dir}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "${apksigner}" ]]; then
            echo "::error::Could not locate apksigner"
            exit 1
          fi

          cert_output="$("${apksigner}" verify --print-certs "${apk_path}" 2>&1)"
          printf '%s\n' "${cert_output}"

          cert_sha256="$(
            printf '%s\n' "${cert_output}" \
              | awk 'BEGIN { IGNORECASE=1 } /certificate SHA-256 digest:/ {
                  sub(/^.*certificate SHA-256 digest:[[:space:]]*/, "")
                  gsub(/:/, "")
                  print tolower($1)
                  exit
                }'
          )"
          if [[ -z "${cert_sha256}" ]]; then
            echo "::error::Could not determine APK signing certificate SHA-256 digest"
            exit 1
          fi

          cat > SIGNING.txt <<EOF
          BCR patched fork release signing information

          Repository: https://github.com/${GITHUB_REPOSITORY}
          Release: ${{ steps.version.outputs.release_tag }}
          Upstream source tag: ${{ steps.version.outputs.upstream_tag }}
          APK signing certificate SHA-256: ${cert_sha256}

          The APK is signed with the autokick/BCR fork maintainer's Android signing key.
          It is not signed with the upstream chenxiaolong/BCR APK signing key.

          The module ZIP is not separately authenticated with the upstream project's SSH
          release-signing key. Do not use upstream signature instructions to authenticate
          this fork's release artifacts.
          EOF

          echo "cert_sha256=${cert_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Prepare module update metadata
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          import zipfile
          from pathlib import Path

          dist_dir = Path("source/app/build/distributions/release")
          zips = sorted(dist_dir.glob("*.zip"))
          if not zips:
              print("::error::No release module zip was produced")
              sys.exit(1)

          zip_path = zips[-1]
          with zipfile.ZipFile(zip_path) as z:
              module_prop = z.read("module.prop").decode("utf-8")

          props = {}
          for line in module_prop.splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  props[key] = value

          version = props.get("version", "").removeprefix("v")
          version_code = props.get("versionCode", "")
          if not version or not version_code:
              print(f"::error::Could not read version or versionCode from {zip_path}")
              sys.exit(1)

          repository = os.environ["GITHUB_REPOSITORY"]
          release_tag = os.environ["RELEASE_TAG"]

          update = {
              "version": version,
              "versionCode": int(version_code),
              "zipUrl": f"https://github.com/{repository}/releases/download/{release_tag}/{zip_path.name}",
              "changelog": f"https://github.com/{repository}/releases/download/{release_tag}/PATCH_NOTES.md",
          }

          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(update, f, indent=4)
              f.write("\n")

          print(json.dumps(update, indent=4))
          PY

      - name: Prepare release checksums
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        shell: bash
        run: |
          set -euo pipefail

          : > SHA256SUMS
          for file in \
            source/app/build/outputs/apk/release/*.apk \
            source/app/build/distributions/release/*.zip \
            "${{ steps.source_archive.outputs.path }}" \
            update.json \
            SIGNING.txt; do
            digest="$(sha256sum "${file}" | awk '{print $1}')"
            printf '%s  %s\n' "${digest}" "$(basename "${file}")" >> SHA256SUMS
          done

      - name: Prepare release notes
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        shell: bash
        run: |
          cat > release-body.md <<EOF
          Automated modified build of upstream BCR ${{ steps.version.outputs.upstream_tag }}.

          This is a GPL-3.0-only modified fork release from autokick/BCR, not an
          official chenxiaolong/BCR release.

          Local patches applied:
          - Use framework Icon object for notification small icon
          - Make ancillary log file creation best-effort
          - Point module update checks to this fork's latest release metadata
          - Embed fork provenance and modification notices in distributed source/module artifacts

          Fork automation commit: ${GITHUB_SHA}
          Upstream source tag: ${{ steps.version.outputs.upstream_tag }}
          APK certificate SHA-256: ${{ steps.signing.outputs.cert_sha256 }}
          Corresponding source: ${{ steps.source_archive.outputs.filename }}

          Verification:
          - SIGNING.txt documents the APK signing certificate.
          - SHA256SUMS contains hashes for the downloadable artifacts.
          - This fork does not use the upstream project's APK signing key or SSH release signature.
          EOF

      - name: Publish GitHub release
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: master
          name: ${{ steps.version.outputs.release_name }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            source/app/build/outputs/apk/release/app-release.apk
            source/app/build/distributions/release/*.zip
            ${{ steps.source_archive.outputs.filename }}
            update.json
            SIGNING.txt
            SHA256SUMS
            fork/FORK_NOTICE.md
            fork/PATCH_NOTES.md
            fork/patches/*.patch

      - name: Remove stale module ZIP assets
        if: steps.release_state.outputs.exists != 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail

          current_zip="$(basename "$(find source/app/build/distributions/release -maxdepth 1 -type f -name '*-release.zip' | sort | tail -n 1)")"
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | select(.name | endswith("-release.zip")) | [.id, .name] | @tsv' \
            | while IFS=\t' read -r asset_id asset_name; do
                if [[ "${asset_name}" != "${current_zip}" ]]; then
                  echo "Removing stale release asset: ${asset_name}"
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                fi
              done
